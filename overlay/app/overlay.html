<!doctype html><html><head><meta charset="utf-8"><title>AI Slop Overlay</title>
<style>
[hidden] { display: none !important; } /* hidden means hidden, whatever display a box has */
html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
#view { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
#chips { position: fixed; inset: 0; pointer-events: none; }
.chip { position: absolute; top: 0; left: 0; padding: 4px 10px; border-radius: 999px; border-left: 3px solid #fb7185;
  font: 600 11.5px/1.3 "Segoe UI", system-ui, sans-serif; color: #fff; background: rgba(20, 22, 28, 0.88);
  box-shadow: 0 2px 10px rgba(0,0,0,.4); cursor: pointer; pointer-events: auto; user-select: none; white-space: nowrap; }
.chip:hover { background: rgba(30, 33, 42, 0.96); }
.chip.score { cursor: default; pointer-events: none; border-left-color: #8b93a3; background: rgba(20, 22, 28, 0.6); font-weight: 500; }
.chip { display: flex; align-items: center; gap: 5px; }
.chip .lbl { cursor: pointer; }
.chip.score .lbl { cursor: default; }
.chip .rate { pointer-events: auto; border: 0; border-radius: 4px; width: 20px; height: 18px; padding: 0; font: 700 13px/18px "Segoe UI", system-ui, sans-serif;
  color: #fff; background: rgba(255,255,255,.14); cursor: pointer; }
.chip .rate.up:hover { background: #3fae6a; }
.chip .rate.down:hover { background: #c42b1c; }
.chip .rate.more:hover { background: #4a6a92; }
#fb { position: fixed; z-index: 10; display: flex; gap: 6px; padding: 6px; border-radius: 9px; background: rgba(20, 22, 28, 0.95); box-shadow: 0 6px 18px rgba(0,0,0,.45); pointer-events: auto; }
#fb input { width: 280px; padding: 6px 8px; border: 1px solid #3a3f4d; border-radius: 6px; background: #12141a; color: #fff; font: 13px "Segoe UI", system-ui, sans-serif; outline: none; }
#fb input:focus { border-color: #fb7185; }
#fb button, #toast button { border: 0; border-radius: 6px; padding: 5px 10px; font: 600 12px "Segoe UI", system-ui, sans-serif; color: #fff; background: #3a3f4d; cursor: pointer; }
#fb #fbSend { background: #fb7185; color: #1a0d10; }
#toast { position: fixed; top: 42px; left: 6px; z-index: 10; display: flex; align-items: center; gap: 8px; padding: 6px 8px 6px 11px; border-radius: 8px;
  background: rgba(20, 22, 28, 0.92); color: #fff; font: 600 12px "Segoe UI", system-ui, sans-serif; box-shadow: 0 4px 12px rgba(0,0,0,.4); pointer-events: auto; }
.x { position: absolute; top: 0; left: 0; width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
  font: 700 13px/1 "Segoe UI", system-ui, sans-serif; color: #fff; background: rgba(20, 22, 28, 0.85); box-shadow: 0 2px 8px rgba(0,0,0,.4);
  cursor: pointer; pointer-events: auto; user-select: none; }
.x:hover { background: #c42b1c; }
#bar { position: fixed; top: 6px; left: 6px; display: flex; align-items: center; gap: 6px; padding: 4px 5px 4px 9px; border-radius: 8px;
  background: rgba(20, 22, 28, 0.82); color: #fff; font: 600 11.5px/1 "Segoe UI", system-ui, sans-serif; pointer-events: auto; user-select: none;
  box-shadow: 0 2px 8px rgba(0,0,0,.35); opacity: 0.75; }
#bar:hover { opacity: 1; }
#bar .dot { width: 7px; height: 7px; border-radius: 50%; background: #fb7185; }
#bar.off .dot { background: #8b93a3; }
#bar button { border: 0; border-radius: 6px; padding: 4px 9px; font: 600 11.5px/1 "Segoe UI", system-ui, sans-serif; cursor: pointer; color: #fff; background: #3a3f4d; }
#bar #onoff { background: #fb7185; color: #1a0d10; min-width: 34px; }
#bar.off #onoff { background: #3a3f4d; color: #fff; }
#bar #close:hover { background: #c42b1c; }
#bar #gear { font-size: 13px; padding: 3px 8px; }
#bar #gear.open { background: #fb7185; color: #1a0d10; }
#menu { position: fixed; top: 33px; left: 6px; z-index: 11; width: 270px; max-height: calc(100vh - 60px); overflow-y: auto; padding: 10px 12px 12px; border-radius: 10px;
  background: rgba(20, 22, 28, 0.96); color: #e8eaf0; font: 13px/1.35 "Segoe UI", system-ui, sans-serif; box-shadow: 0 10px 28px rgba(0,0,0,.5); pointer-events: auto; }
#menu h3 { margin: 10px 0 5px; font: 600 11px "Segoe UI", system-ui, sans-serif; letter-spacing: .04em; text-transform: uppercase; color: #8b93a3; }
#menu h3:first-child { margin-top: 0; }
#menu label { display: flex; align-items: center; gap: 8px; padding: 3px 0; cursor: pointer; }
#menu input { accent-color: #fb7185; margin: 0; }
#menu .seg { display: flex; gap: 4px; }
#menu .seg button { flex: 1; border: 0; border-radius: 6px; padding: 5px 4px; font: 600 12px "Segoe UI", system-ui, sans-serif; color: #e8eaf0; background: #2a2e3a; cursor: pointer; }
#menu .seg button.on { background: #fb7185; color: #1a0d10; }
#menu .app { display: flex; justify-content: space-between; align-items: center; padding: 3px 0; }
#menu .app button, #menu .act { border: 0; border-radius: 6px; padding: 4px 9px; font: 600 12px "Segoe UI", system-ui, sans-serif; color: #e8eaf0; background: #2a2e3a; cursor: pointer; }
#menu .acts { display: flex; flex-wrap: wrap; gap: 5px; }
#menu .none { color: #8b93a3; }
#menu .slider { gap: 10px; }
#menu .slider input { flex: 1; }
#menu .slider .val { width: 46px; text-align: right; font-variant-numeric: tabular-nums; }
</style></head><body><canvas id="view"></canvas><div id="chips"></div>
<div id="fb" hidden><input id="fbIn" type="text" maxlength="300" placeholder="What's wrong? e.g. &quot;this is AI&quot;, &quot;stop in Discord&quot;, &quot;too many false alarms&quot;"><button id="fbSend" type="button">Send</button><button id="fbCancel" type="button">✕</button></div>
<div id="toast" hidden><span class="msg"></span><button class="undo" type="button">Undo</button></div>
<div id="bar"><span class="dot"></span><span class="name">AI Slop</span><button id="onoff" type="button">On</button><button id="gear" type="button" title="Settings">⚙</button><button id="close" type="button" title="Close AI Slop Overlay">✕</button></div>
<div id="menu" hidden></div><script src="overlay.js"></script></body></html>
