<!doctype html><html><head><meta charset="utf-8"><title>AI Slop Overlay</title>
<style>
html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
#view { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
#chips { position: fixed; inset: 0; pointer-events: none; }
.chip { position: absolute; top: 0; left: 0; padding: 4px 10px; border-radius: 999px; border-left: 3px solid #fb7185;
  font: 600 11.5px/1.3 "Segoe UI", system-ui, sans-serif; color: #fff; background: rgba(20, 22, 28, 0.88);
  box-shadow: 0 2px 10px rgba(0,0,0,.4); cursor: pointer; pointer-events: auto; user-select: none; white-space: nowrap; }
.chip:hover { background: rgba(30, 33, 42, 0.96); }
#bar { position: fixed; top: 6px; left: 6px; display: flex; align-items: center; gap: 6px; padding: 4px 5px 4px 9px; border-radius: 8px;
  background: rgba(20, 22, 28, 0.82); color: #fff; font: 600 11.5px/1 "Segoe UI", system-ui, sans-serif; pointer-events: auto; user-select: none;
  box-shadow: 0 2px 8px rgba(0,0,0,.35); opacity: 0.75; }
#bar:hover { opacity: 1; }
#bar .dot { width: 7px; height: 7px; border-radius: 50%; background: #fb7185; }
#bar.off .dot { background: #8b93a3; }
#bar button { border: 0; border-radius: 6px; padding: 4px 9px; font: 600 11.5px/1 "Segoe UI", system-ui, sans-serif; cursor: pointer; color: #fff; background: #3a3f4d; }
#bar #onoff { background: #fb7185; color: #1a0d10; min-width: 34px; }
#bar.off #onoff { background: #3a3f4d; color: #fff; }
#bar #close:hover { background: #c42b1c; }
</style></head><body><canvas id="view"></canvas><div id="chips"></div>
<div id="bar"><span class="dot"></span><span class="name">AI Slop</span><button id="onoff" type="button">On</button><button id="close" type="button" title="Close AI Slop Overlay">✕</button></div><script src="overlay.js"></script></body></html>
